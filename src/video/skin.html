<media-container class="media-skin media-container media-video" data-theme="slate" data-preset="video">
  <!-- Add a compatible media component here. -->
  <media-poster class="media-poster">
    <img alt="" decoding="async" class="media-poster-image">
  </media-poster>

  <!--
    Opening slate: shown on the poster until the first play, then it claps, flashes, and drops away.
    Closing slate: shown when playback ends. Both are decorative and let pointer events through.
  -->
  <div class="slate-card slate-card-open" aria-hidden="true">
    <div class="slate-card-sticks">
      <span class="slate-stick slate-card-stick-top"></span>
      <span class="slate-stick slate-stick-base"></span>
    </div>
    <div class="slate-card-body">
      <div class="slate-card-cell slate-card-prod">
        <span class="slate-label">Prod.</span>
        <media-title class="slate-card-chalk slate-card-title"></media-title>
      </div>
      <div class="slate-card-cell">
        <span class="slate-label">Roll</span>
        <span class="slate-card-chalk">A001</span>
      </div>
      <div class="slate-card-cell">
        <span class="slate-label">Scene</span>
        <span class="slate-card-chalk">01</span>
      </div>
      <div class="slate-card-cell">
        <span class="slate-label">Take</span>
        <slate-take class="slate-card-chalk"></slate-take>
      </div>
      <div class="slate-card-foot">
        <span>Cam A</span>
        <span>24 fps</span>
        <span class="slate-card-cue">Press play to roll</span>
      </div>
    </div>
  </div>

  <div class="slate-card slate-card-wrap" aria-hidden="true">
    <div class="slate-card-body">
      <div class="slate-card-cell slate-card-prod">
        <span class="slate-label">That’s a</span>
        <span class="slate-card-chalk slate-card-wrap-title">Wrap!</span>
      </div>
      <div class="slate-card-cell">
        <span class="slate-label">Takes</span>
        <slate-take class="slate-card-chalk"></slate-take>
      </div>
      <div class="slate-card-cell">
        <span class="slate-label">Running time</span>
        <slate-timecode type="duration" class="slate-card-code"></slate-timecode>
      </div>
      <div class="slate-card-foot">
        <span>Print it</span>
        <span class="slate-card-cue">Press play to go again</span>
      </div>
    </div>
  </div>

  <media-error-dialog>
    <media-dialog-backdrop class="media-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="media-dialog-popup">
      <span class="slate-label slate-dialog-label" aria-hidden="true">No good · Take again</span>
      <media-dialog-title class="media-dialog-title"></media-dialog-title>
      <media-dialog-description class="media-dialog-description"></media-dialog-description>
      <media-dialog-close class="media-button media-dialog-close"></media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <media-controls>
    <media-controls-backdrop class="video-controls-backdrop"></media-controls-backdrop>

    <media-controls-group class="media-buffering-indicator-controls">
      <media-buffering-indicator class="media-buffering-indicator media-buffering-indicator-backdrop">
        <media-icon family="slate" name="spinner" class="media-buffering-indicator-spinner-icon"></media-icon>
      </media-buffering-indicator>
    </media-controls-group>

    <media-controls-content class="video-controls-content">
      <media-tooltip-group>
        <media-controls-group class="video-controls-top">
          <!-- Tally light: REC while playing, STBY while paused. -->
          <div class="slate-tally" aria-hidden="true">
            <span class="slate-tally-dot"></span>
            <span class="slate-tally-rec">Rec</span>
            <span class="slate-tally-stby">Stby</span>
          </div>
          <media-title class="media-title"></media-title>

          <media-airplay-button class="media-button media-airplay-button" id="slate-airplay-trigger">
            <media-icon family="slate" name="airplay-enter" class="media-button-icon media-airplay-button-enter-icon"></media-icon>
            <media-icon family="slate" name="airplay-exit" class="media-button-icon media-airplay-button-exit-icon"></media-icon>
          </media-airplay-button>
          <media-tooltip trigger="slate-airplay-trigger" side="bottom" class="media-popup media-popup-safe-area media-tooltip-popup media-tooltip-screen-popup">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
          </media-tooltip>

          <media-cast-button class="media-button media-cast-button" id="slate-cast-trigger">
            <media-icon family="slate" name="cast-enter" class="media-button-icon media-cast-button-enter-icon"></media-icon>
            <media-icon family="slate" name="cast-exit" class="media-button-icon media-cast-button-exit-icon"></media-icon>
          </media-cast-button>
          <media-tooltip trigger="slate-cast-trigger" side="bottom" class="media-popup media-popup-safe-area media-tooltip-popup media-tooltip-screen-popup">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
          </media-tooltip>

          <media-pip-button class="media-button media-pip-button" id="slate-pip-trigger">
            <media-icon family="slate" name="pip-enter" class="media-button-icon media-pip-button-enter-icon"></media-icon>
            <media-icon family="slate" name="pip-exit" class="media-button-icon media-pip-button-exit-icon"></media-icon>
          </media-pip-button>
          <media-tooltip trigger="slate-pip-trigger" side="bottom" class="media-popup media-popup-safe-area media-tooltip-popup media-tooltip-screen-popup">
            <media-tooltip-label></media-tooltip-label>
            <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
          </media-tooltip>
        </media-controls-group>

        <media-buffering-indicator class="video-controls-buffering">
          <media-controls-group class="video-controls-center">
            <media-seek-button seconds="-10" class="media-button video-controls-center-button video-controls-center-seek" id="slate-center-back-trigger">
              <div class="media-seek-button-content">
                <media-icon family="slate" name="seek" class="media-button-icon media-seek-button-backward-icon video-controls-center-seek-icon"></media-icon>
                <span class="media-seek-button-label media-seek-button-backward-label">10</span>
              </div>
            </media-seek-button>
            <media-tooltip trigger="slate-center-back-trigger" disabled side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>

            <media-play-button class="media-button media-play-button video-controls-center-button video-controls-center-play" id="slate-center-play-trigger">
              <media-icon family="slate" name="restart" class="media-button-icon-base media-play-button-restart-icon video-controls-center-play-icon"></media-icon>
              <media-icon family="slate" name="play" class="media-button-icon-base media-play-button-play-icon video-controls-center-play-icon"></media-icon>
              <media-icon family="slate" name="pause" class="media-button-icon-base media-play-button-pause-icon video-controls-center-play-icon"></media-icon>
            </media-play-button>
            <media-tooltip trigger="slate-center-play-trigger" disabled side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>

            <media-seek-button seconds="10" class="media-button video-controls-center-button video-controls-center-seek" id="slate-center-forward-trigger">
              <div class="media-seek-button-content">
                <media-icon family="slate" name="seek" class="media-button-icon video-controls-center-seek-icon"></media-icon>
                <span class="media-seek-button-label media-seek-button-forward-label">10</span>
              </div>
            </media-seek-button>
            <media-tooltip trigger="slate-center-forward-trigger" disabled side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
              <media-tooltip-label></media-tooltip-label>
              <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
            </media-tooltip>
          </media-controls-group>
        </media-buffering-indicator>

        <!-- The slate board. -->
        <div class="video-controls-bottom video-controls-video-bottom slate-board">
          <div class="slate-sticks" aria-hidden="true">
            <span class="slate-stick slate-stick-top"></span>
            <span class="slate-stick slate-stick-base"></span>
          </div>

          <div class="video-controls-slider-row">
            <media-time-slider class="media-time-slider" thumb-alignment="edge">
              <media-time-slider-chapters class="media-time-slider-chapters">
                <template>
                  <div class="media-time-slider-chapter">
                    <media-slider-track class="media-time-slider-track">
                      <media-slider-buffer class="media-time-slider-buffer"></media-slider-buffer>
                      <media-slider-fill class="media-time-slider-fill"></media-slider-fill>
                    </media-slider-track>
                  </div>
                </template>
              </media-time-slider-chapters>
              <media-slider-thumb class="media-time-slider-thumb"></media-slider-thumb>
              <media-slider-preview class="media-time-slider-preview">
                <media-slider-thumbnail class="media-slider-thumbnail">
                  <img alt="" aria-hidden="true" decoding="async" class="media-slider-thumbnail-image">
                </media-slider-thumbnail>
                <div class="media-time-slider-preview-meta">
                  <div class="media-time-slider-preview-label">
                    <media-slider-value class="media-time-slider-value" type="pointer"></media-slider-value>
                    <media-time-slider-chapter-title class="media-time-slider-chapter-title"></media-time-slider-chapter-title>
                  </div>
                </div>
              </media-slider-preview>
            </media-time-slider>
          </div>

          <media-controls-group class="video-controls-row">
            <media-controls-group class="video-controls-group video-controls-start">
              <media-play-button class="media-button media-play-button slate-play" id="slate-play-trigger">
                <media-icon family="slate" name="restart" class="media-button-icon-base media-play-button-restart-icon"></media-icon>
                <media-icon family="slate" name="play" class="media-button-icon-base media-play-button-play-icon"></media-icon>
                <media-icon family="slate" name="pause" class="media-button-icon-base media-play-button-pause-icon"></media-icon>
              </media-play-button>
              <media-tooltip trigger="slate-play-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
              </media-tooltip>

              <media-mute-button commandfor="slate-volume-popup" class="media-button media-mute-button" id="slate-mute-trigger">
                <media-icon family="slate" name="volume-off" class="media-button-icon media-mute-button-off-icon"></media-icon>
                <media-icon family="slate" name="volume-high" class="media-button-icon media-mute-button-high-icon"></media-icon>
              </media-mute-button>
              <media-tooltip trigger="slate-mute-trigger" delay="0" disabled side="top" sticky class="media-popup media-popup-safe-area media-tooltip-popup">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
              </media-tooltip>
              <media-volume-popover open-on-hover delay="200" close-delay="100" side="top" class="media-popup media-popup-safe-area media-volume-popover-popup" id="slate-volume-popup">
                <media-volume-slider class="media-volume-slider" orientation="vertical" thumb-alignment="edge">
                  <media-slider-track class="media-volume-slider-track">
                    <media-slider-fill class="media-volume-slider-fill"></media-slider-fill>
                  </media-slider-track>
                  <media-slider-thumb class="media-volume-slider-thumb"></media-slider-thumb>
                </media-volume-slider>
              </media-volume-popover>

              <!-- Timecode cell. The readouts are decorative; the media-time elements carry the accessible time. -->
              <div class="slate-cell slate-tc">
                <span class="slate-label" aria-hidden="true">TC</span>
                <span class="slate-tc-readout">
                  <slate-timecode class="slate-timecode"></slate-timecode>
                  <span class="slate-tc-duration" aria-hidden="true">/ <slate-timecode type="duration"></slate-timecode></span>
                </span>
                <media-time-group class="slate-visually-hidden">
                  <media-time type="current"></media-time>
                  <media-time-separator></media-time-separator>
                  <media-time type="duration"></media-time>
                </media-time-group>
              </div>

              <div class="slate-cell slate-take-cell" aria-hidden="true">
                <span class="slate-label">Take</span>
                <slate-take class="slate-take"></slate-take>
              </div>
            </media-controls-group>

            <media-controls-group class="video-controls-group video-controls-end">
              <media-captions-button class="media-button media-captions-button" id="slate-captions-trigger">
                <media-icon family="slate" name="captions-off" class="media-button-icon media-captions-button-off-icon"></media-icon>
                <media-icon family="slate" name="captions-on" class="media-button-icon media-captions-button-on-icon"></media-icon>
              </media-captions-button>
              <media-tooltip trigger="slate-captions-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
              </media-tooltip>

              <button commandfor="slate-settings-popup" class="media-button" id="slate-settings-trigger">
                <media-icon family="slate" name="gear" class="media-button-icon"></media-icon>
                <media-text class="media-settings-button-label" token="menu.settings">Settings</media-text>
              </button>
              <media-tooltip trigger="slate-settings-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
                <media-text token="menu.settings">Settings</media-text>
              </media-tooltip>
              <media-menu side="top" align="end" class="media-popup media-popup-safe-area media-menu-popup" id="slate-settings-popup">
                <media-menu-content class="media-menu-content">
                  <media-menu-item commandfor="slate-quality-content" class="media-menu-item">
                    <media-icon family="slate" name="switches" class="media-menu-trigger-icon"></media-icon>
                    <media-text token="menu.quality">Quality</media-text>
                    <span class="media-menu-hint">
                      <span data-part="value" class="media-menu-hint-label"></span>
                      <media-icon family="slate" name="chevron" class="media-menu-forward-chevron"></media-icon>
                    </span>
                  </media-menu-item>
                  <media-menu-content class="media-menu-content" id="slate-quality-content">
                    <media-menu-item class="media-menu-back-item">
                      <media-icon family="slate" name="chevron" class="media-menu-back-chevron"></media-icon>
                      <media-text token="menu.quality">Quality</media-text>
                    </media-menu-item>
                    <media-menu-separator class="media-menu-separator"></media-menu-separator>
                    <media-quality-radio-group class="media-menu-radio-group">
                      <template>
                        <media-menu-radio-item class="media-menu-radio-item">
                          <span>
                            <span data-part="label"></span>
                            <sup data-part="tier" class="media-menu-tier"></sup>
                          </span>
                          <span data-part="badge" class="media-menu-badge"></span>
                          <media-menu-item-indicator force-mount class="media-menu-indicator">
                            <media-icon family="slate" name="check" class="media-menu-radio-icon"></media-icon>
                          </media-menu-item-indicator>
                        </media-menu-radio-item>
                      </template>
                    </media-quality-radio-group>
                  </media-menu-content>

                  <media-menu-item commandfor="slate-audio-content" class="media-menu-item">
                    <media-icon family="slate" name="speech" class="media-menu-trigger-icon"></media-icon>
                    <media-text token="menu.audio">Audio</media-text>
                    <span class="media-menu-hint">
                      <span data-part="value" class="media-menu-hint-label"></span>
                      <media-icon family="slate" name="chevron" class="media-menu-forward-chevron"></media-icon>
                    </span>
                  </media-menu-item>
                  <media-menu-content class="media-menu-content" id="slate-audio-content">
                    <media-menu-item class="media-menu-back-item">
                      <media-icon family="slate" name="chevron" class="media-menu-back-chevron"></media-icon>
                      <media-text token="menu.audio">Audio</media-text>
                    </media-menu-item>
                    <media-menu-separator class="media-menu-separator"></media-menu-separator>
                    <media-audio-track-radio-group class="media-menu-radio-group">
                      <template>
                        <media-menu-radio-item class="media-menu-radio-item">
                          <span data-part="label"></span>
                          <media-menu-item-indicator force-mount class="media-menu-indicator">
                            <media-icon family="slate" name="check" class="media-menu-radio-icon"></media-icon>
                          </media-menu-item-indicator>
                        </media-menu-radio-item>
                      </template>
                    </media-audio-track-radio-group>
                  </media-menu-content>

                  <media-menu-item commandfor="slate-speed-content" class="media-menu-item">
                    <media-icon family="slate" name="speed" class="media-menu-trigger-icon"></media-icon>
                    <media-text token="menu.speed">Speed</media-text>
                    <span class="media-menu-hint">
                      <span data-part="value" class="media-menu-hint-label"></span>
                      <media-icon family="slate" name="chevron" class="media-menu-forward-chevron"></media-icon>
                    </span>
                  </media-menu-item>
                  <media-menu-content class="media-menu-content" id="slate-speed-content">
                    <media-menu-item class="media-menu-back-item">
                      <media-icon family="slate" name="chevron" class="media-menu-back-chevron"></media-icon>
                      <media-text token="menu.speed">Speed</media-text>
                    </media-menu-item>
                    <media-menu-separator class="media-menu-separator"></media-menu-separator>
                    <media-playback-rate-radio-group class="media-menu-radio-group">
                      <template>
                        <media-menu-radio-item class="media-menu-radio-item">
                          <span data-part="label"></span>
                          <media-menu-item-indicator force-mount class="media-menu-indicator">
                            <media-icon family="slate" name="check" class="media-menu-radio-icon"></media-icon>
                          </media-menu-item-indicator>
                        </media-menu-radio-item>
                      </template>
                    </media-playback-rate-radio-group>
                  </media-menu-content>

                  <media-menu-item commandfor="slate-captions-content" class="media-menu-item">
                    <media-icon family="slate" name="captions-off" class="media-menu-trigger-icon"></media-icon>
                    <media-text token="menu.captions">Captions</media-text>
                    <span class="media-menu-hint">
                      <span data-part="value" class="media-menu-hint-label"></span>
                      <media-icon family="slate" name="chevron" class="media-menu-forward-chevron"></media-icon>
                    </span>
                  </media-menu-item>
                  <media-menu-content class="media-menu-content" id="slate-captions-content">
                    <media-menu-item class="media-menu-back-item">
                      <media-icon family="slate" name="chevron" class="media-menu-back-chevron"></media-icon>
                      <media-text token="menu.captions">Captions</media-text>
                    </media-menu-item>
                    <media-menu-separator class="media-menu-separator"></media-menu-separator>
                    <media-captions-radio-group class="media-menu-radio-group">
                      <template>
                        <media-menu-radio-item class="media-menu-radio-item">
                          <span data-part="label"></span>
                          <span data-part="badge" class="media-menu-badge"></span>
                          <media-menu-item-indicator force-mount class="media-menu-indicator">
                            <media-icon family="slate" name="check" class="media-menu-radio-icon"></media-icon>
                          </media-menu-item-indicator>
                        </media-menu-radio-item>
                      </template>
                    </media-captions-radio-group>
                  </media-menu-content>
                </media-menu-content>
              </media-menu>

              <media-fullscreen-button class="media-button media-fullscreen-button" id="slate-fullscreen-trigger">
                <media-icon family="slate" name="fullscreen-enter" class="media-button-icon media-fullscreen-button-enter-icon"></media-icon>
                <media-icon family="slate" name="fullscreen-exit" class="media-button-icon media-fullscreen-button-exit-icon"></media-icon>
              </media-fullscreen-button>
              <media-tooltip trigger="slate-fullscreen-trigger" side="top" class="media-popup media-popup-safe-area media-tooltip-popup">
                <media-tooltip-label></media-tooltip-label>
                <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
              </media-tooltip>
            </media-controls-group>
          </media-controls-group>
        </div>
      </media-tooltip-group>
    </media-controls-content>
  </media-controls>

  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep"></media-hotkey>
  <media-hotkey keys="l" action="seekStep"></media-hotkey>
  <media-hotkey keys="j" action="seekStep"></media-hotkey>
  <media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
  <media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
  <media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>
  <media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
  <media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
  <media-hotkey keys=">" action="speedUp"></media-hotkey>
  <media-hotkey keys="<" action="speedDown"></media-hotkey>
  <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
  <media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
  <media-hotkey keys="i" action="togglePictureInPicture"></media-hotkey>

  <media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
  <media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="left"></media-gesture>
  <media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
  <media-gesture type="doubletap" action="seekStep" region="right"></media-gesture>

  <media-status-announcer class="media-status-announcer"></media-status-announcer>

  <div aria-hidden="true" class="media-indicator-group">
    <media-volume-indicator class="media-indicator media-volume-indicator">
      <media-volume-indicator-fill class="media-volume-indicator-fill">
        <media-icon family="slate" name="volume-high" class="media-volume-indicator-icon media-volume-indicator-high-icon"></media-icon>
        <media-icon family="slate" name="volume-low" class="media-volume-indicator-icon media-volume-indicator-low-icon"></media-icon>
        <media-icon family="slate" name="volume-off" class="media-volume-indicator-icon media-volume-indicator-off-icon"></media-icon>
        <media-volume-indicator-value class="media-volume-indicator-value"></media-volume-indicator-value>
      </media-volume-indicator-fill>
    </media-volume-indicator>
    <media-status-indicator actions="toggleSubtitles,toggleFullscreen,togglePictureInPicture" class="media-indicator media-status-indicator">
      <media-icon family="slate" name="captions-on" class="media-status-indicator-icon media-status-indicator-captions-on-icon"></media-icon>
      <media-icon family="slate" name="captions-off" class="media-status-indicator-icon media-status-indicator-captions-off-icon"></media-icon>
      <media-icon family="slate" name="fullscreen-enter" class="media-status-indicator-icon media-status-indicator-fullscreen-enter-icon"></media-icon>
      <media-icon family="slate" name="fullscreen-exit" class="media-status-indicator-icon media-status-indicator-fullscreen-exit-icon"></media-icon>
      <media-icon family="slate" name="pip-enter" class="media-status-indicator-icon media-status-indicator-pip-enter-icon"></media-icon>
      <media-icon family="slate" name="pip-exit" class="media-status-indicator-icon media-status-indicator-pip-exit-icon"></media-icon>
      <media-status-indicator-value></media-status-indicator-value>
